<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading చందమామ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu&family=Inter&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #0f1419; color: #e8eaed; font-family: 'Inter', 'Noto Sans Telugu', sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1a2332; padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3544; }
        #viewerContainer { flex: 1; overflow: auto; display: flex; justify-content: center; background: #1e1e1e; padding: 1rem; }
        #pdfCanvas { max-width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .controls { display: flex; gap: 0.5rem; align-items: center; }
        button { background: #f4c430; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        a { color: #f4c430; }
    </style>
</head>
<body>
    <header>
        <a href="index.html">← Back</a>
        <div class="controls">
            <button id="prevBtn">Prev</button>
            <span id="pageInfo">Loading...</span>
            <button id="nextBtn">Next</button>
            <button id="zoomIn">+</button>
            <button id="zoomOut">-</button>
        </div>
        <a id="downloadLink" target="_blank">Download</a>
    </header>
    <div id="viewerContainer"><canvas id="pdfCanvas"></canvas></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const filename = new URLSearchParams(window.location.search).get('file');
        if (!filename) { document.body.innerHTML = '<p style="padding:2rem;text-align:center;">No file. <a href="index.html">Back</a></p>'; throw new Error(); }
        const pdfUrl = `https://archive.org/download/chandamama_telugu_all/${filename}`;
        document.getElementById('downloadLink').href = pdfUrl;
        let pdfDoc, pageNum = 1, pageRendering = false, pageNumPending = null, scale = 1.5;
        const canvas = document.getElementById('pdfCanvas'), ctx = canvas.getContext('2d');
        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale });
                canvas.height = viewport.height; canvas.width = viewport.width;
                page.render({ canvasContext: ctx, viewport }).promise.then(() => {
                    pageRendering = false;
                    if (pageNumPending !== null) { renderPage(pageNumPending); pageNumPending = null; }
                });
            });
            document.getElementById('pageInfo').textContent = `Page ${num} / ${pdfDoc.numPages}`;
            document.getElementById('prevBtn').disabled = num <= 1;
            document.getElementById('nextBtn').disabled = num >= pdfDoc.numPages;
        }
        function queueRenderPage(num) { if (pageRendering) pageNumPending = num; else renderPage(num); }
        document.getElementById('prevBtn').onclick = () => { if (pageNum > 1) { pageNum--; queueRenderPage(pageNum); } };
        document.getElementById('nextBtn').onclick = () => { if (pageNum < pdfDoc.numPages) { pageNum++; queueRenderPage(pageNum); } };
        document.getElementById('zoomIn').onclick = () => { scale += 0.25; queueRenderPage(pageNum); };
        document.getElementById('zoomOut').onclick = () => { if (scale > 0.5) { scale -= 0.25; queueRenderPage(pageNum); } };
        pdfjsLib.getDocument(pdfUrl).promise.then(pdf => { pdfDoc = pdf; renderPage(1); }).catch(e => {
            document.getElementById('viewerContainer').innerHTML = `<p style="color:#f66;padding:2rem;">Error loading PDF: ${e.message}<br><a href="${pdfUrl}" target="_blank">Try direct link</a></p>`;
        });
    </script>
</body>
</html>
