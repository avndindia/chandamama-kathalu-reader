<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>చందమామ రీడర్</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0f1419; --card:#1a2332; --accent:#f4c430; --text:#e8eaed; }
    body { margin:0; font-family:'Inter','Noto Sans Telugu',sans-serif; background:var(--bg); color:var(--text); }
    #toolbar { background:var(--card); padding:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #2a3544; }
    #canvas-container { text-align:center; overflow:auto; height:calc(100vh - 70px); padding:20px 0; }
    canvas { max-width:100%; box-shadow:0 0 30px rgba(0,0,0,0.6); background:white; }
    button { background:#243044; color:white; border:1px solid #2a3544; padding:8px 14px; border-radius:6px; cursor:pointer; }
    button:hover { background:var(--accent); color:#000; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <div id="toolbar">
    <a href="index.html">← తిరిగి</a>
    <button id="prev">◀ మునుపటి</button>
    <span id="page-info">పేజీ 1</span>
    <button id="next">తరువాత ▶</button>
    <button id="zoom-out">-</button>
    <span id="zoom-level">120%</span>
    <button id="zoom-in">+</button>
    <a id="download" target="_blank" style="margin-left:auto;">డౌన్‌లోడ్</a>
  </div>
  <div id="canvas-container"><canvas id="pdf-canvas"></canvas></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file');
    let pdfUrl = `https://archive.org/download/chandamama_telugu_all/${file}`;
    fetch('chandamama_catalog.json').then(r => r.json()).then(cat => {
      for (const year in cat) {
        const issue = cat[year].find(i => i.filename === file);
        if (issue && issue.r2_url) { pdfUrl = issue.r2_url; break; }
      }
      loadPdf(pdfUrl);
    }).catch(() => loadPdf(pdfUrl));
    function loadPdf(url) {
      document.getElementById('download').href = url;
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null, scale = 1.2;
      function updateZoom() { document.getElementById('zoom-level').textContent = Math.round(scale*100)+'%'; }
      async function renderPage(num) {
        pageRendering = true;
        const page = await pdfDoc.getPage(num);
        const viewport = page.getViewport({scale});
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        await page.render({canvasContext: ctx, viewport}).promise;
        pageRendering = false;
        document.getElementById('page-info').textContent = `పేజీ ${num} / ${pdfDoc.numPages}`;
        if (pageNumPending !== null) { renderPage(pageNumPending); pageNumPending = null; }
      }
      function queue(num) { if (pageRendering) pageNumPending = num; else renderPage(num); }
      document.getElementById('prev').onclick = () => { if (pageNum>1) { pageNum--; queue(pageNum); } };
      document.getElementById('next').onclick = () => { if (pdfDoc && pageNum < pdfDoc.numPages) { pageNum++; queue(pageNum); } };
      document.getElementById('zoom-in').onclick = () => { scale += 0.2; updateZoom(); queue(pageNum); };
      document.getElementById('zoom-out').onclick = () => { if (scale>0.4) { scale -= 0.2; updateZoom(); queue(pageNum); } };
      document.addEventListener('keydown', e => {
        if (e.key==='ArrowLeft'||e.key==='ArrowUp') document.getElementById('prev').click();
        if (e.key==='ArrowRight'||e.key==='ArrowDown') document.getElementById('next').click();
      });
      pdfjsLib.getDocument(url).promise.then(pdf => {
        pdfDoc = pdf; updateZoom(); renderPage(pageNum);
      }).catch(err => {
        document.getElementById('canvas-container').innerHTML = '<p style="color:#f88;padding:40px;">PDF load failed: ' + err.message + '</p>';
      });
    }
  </script>
</body>
</html>
